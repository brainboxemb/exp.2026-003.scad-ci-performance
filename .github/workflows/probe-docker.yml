name: Probe Docker OpenSCAD version

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    name: Probe scad-toolchain v0.4.1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    steps:
      - name: Checkout benchmark fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report exact toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          echo "OpenSCAD direct version:"
          openscad --version
          echo
          echo "SCAD toolchain inventory:"
          scad-toolchain-info

      - name: Smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          xvfb-run -a openscad -o out/benchmark.stl fixture/benchmark.scad
          xvfb-run -a openscad -o out/benchmark.png --imgsize=1024,768 --autocenter --viewall --render fixture/benchmark.scad
          python3 scripts/watermark.py out/benchmark.png --text "SCAD CI performance benchmark"
          test -s out/benchmark.stl
          test -s out/benchmark.png
          sha256sum out/benchmark.stl out/benchmark.png
